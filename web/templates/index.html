<!DOCTYPE html>
<html>
<head>
    <title>Router Management</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>You are calling me from {{request.remote_addr}}</h1>
    
    <h2>Add Router</h2>
    <form method="POST" action="/add">
        <input name="ip" placeholder="Router IP" required />
        <input name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Add Router</button>
    </form>

    <h2>Router List</h2>
    <ul>
        {% for router in data %}
        <li>
            <a href="/router/{{ router.ip }}">IP: {{ router.ip }}</a> | User: {{ router.username }}
            <form method="POST" action="{{ url_for('delete_comment') }}" style="display:inline">
                <input type="hidden" name="idx" value="{{ loop.index0 }}">
                <button type="submit">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
